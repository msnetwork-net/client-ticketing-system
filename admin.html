<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Cloud Support Console</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f19 75%);
            min-height: 100vh;
            color: #f1f5f9;
            padding: 24px;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Top Header Navigation */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            border: 1px solid #1f2937;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .top-bar h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f9fafb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar h1 i { color: #0066cc; }

        .stats-badge {
            background: #1f2937;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #9ca3af;
            border: 1px solid #374151;
        }

        /* Metrics Summary Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 20px;
            border-radius: 10px;
        }

        .metric-card p { font-size: 0.8rem; color: #9ca3af; font-weight: 500; text-transform: uppercase; }
        .metric-card h3 { font-size: 1.8rem; font-weight: 700; margin-top: 6px; color: #f9fafb; }

        /* Tickets Table Section */
        .table-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .table-header {
            padding: 18px 24px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h2 { font-size: 1.1rem; font-weight: 600; color: #f9fafb; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #1f2937;
            padding: 12px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid #1f2937;
            font-size: 0.9rem;
            color: #e5e7eb;
        }

        tr:hover { background: rgba(31, 41, 55, 0.5); }

        /* Priority & Status Badges */
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-open { background: rgba(234, 179, 8, 0.15); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
        .badge-in-progress { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-resolved { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }

        .priority-high { color: #f87171; font-weight: 600; }
        .priority-medium { color: #fbbf24; font-weight: 600; }
        .priority-low { color: #34d399; font-weight: 600; }

        select.status-select {
            background: #0b0f19;
            border: 1px solid #374151;
            color: #f9fafb;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        select.status-select:focus { border-color: #0066cc; }

        .refresh-btn {
            background: #0066cc;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .refresh-btn:hover { background: #0052a3; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Top Bar -->
    <div class="top-bar">
        <h1><i class="fa-solid fa-shield-halved"></i> Cloud Support Operations Console</h1>
        <div class="stats-badge">
            <i class="fa-solid fa-server" style="color: #10b981; margin-right: 6px;"></i> System Status: <strong>Operational</strong>
        </div>
    </div>

    <!-- Metrics -->
    <div class="metrics-grid">
        <div class="metric-card">
            <p>Total Incidents</p>
            <h3 id="totalTickets">0</h3>
        </div>
        <div class="metric-card">
            <p>Open / Pending</p>
            <h3 id="openTickets" style="color: #fde047;">0</h3>
        </div>
        <div class="metric-card">
            <p>In Progress</p>
            <h3 id="progressTickets" style="color: #93c5fd;">0</h3>
        </div>
        <div class="metric-card">
            <p>Resolved</p>
            <h3 id="resolvedTickets" style="color: #86efac;">0</h3>
        </div>
    </div>

    <!-- Tickets Table -->
    <div class="table-card">
        <div class="table-header">
            <h2>Active Service Tickets</h2>
            <button class="refresh-btn" onclick="fetchTickets()"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Client / Org</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Issue Summary</th>
                        <th>Created At</th>
                        <th>Status Action</th>
                    </tr>
                </thead>
                <tbody id="ticketsTableBody">
                    <tr>
                        <td colspan="7" style="text-align: center; color: #9ca3af; padding: 30px;">Loading tickets...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function fetchTickets() {
        try {
            const res = await fetch('/api/tickets');
            const tickets = await res.json();
            renderDashboard(tickets);
        } catch (err) {
            console.error('Failed to load tickets:', err);
        }
    }

    function renderDashboard(tickets) {
        const tbody = document.getElementById('ticketsTableBody');
        tbody.innerHTML = '';

        let openCount = 0;
        let progressCount = 0;
        let resolvedCount = 0;

        document.getElementById('totalTickets').innerText = tickets.length;

        if (tickets.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #9ca3af; padding: 30px;">No support tickets registered yet.</td></tr>';
            return;
        }

        tickets.forEach(ticket => {
            if (ticket.status === 'Open') openCount++;
            else if (ticket.status === 'In Progress') progressCount++;
            else if (ticket.status === 'Resolved') resolvedCount++;

            let statusBadgeClass = 'badge-open';
            if (ticket.status === 'In Progress') statusBadgeClass = 'badge-in-progress';
            if (ticket.status === 'Resolved') statusBadgeClass = 'badge-resolved';

            let priorityClass = 'priority-medium';
            if (ticket.priority === 'High') priorityClass = 'priority-high';
            if (ticket.priority === 'Low') priorityClass = 'priority-low';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong style="color: #60a5fa;">${ticket.id}</strong></td>
                <td>
                    <strong>${ticket.clientName}</strong><br>
                    <span style="font-size: 0.8rem; color: #9ca3af;">${ticket.phone}</span>
                </td>
                <td>${ticket.category}</td>
                <td><span class="${priorityClass}">${ticket.priority}</span></td>
                <td style="max-width: 250px;">${ticket.issue}</td>
                <td style="font-size: 0.8rem; color: #9ca3af;">${ticket.createdAt}</td>
                <td>
                    <select class="status-select" onchange="updateTicketStatus('${ticket.id}', this.value)">
                        <option value="Open" ${ticket.status === 'Open' ? 'selected' : ''}>Open</option>
                        <option value="In Progress" ${ticket.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                        <option value="Resolved" ${ticket.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                    </select>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('openTickets').innerText = openCount;
        document.getElementById('progressTickets').innerText = progressCount;
        document.getElementById('resolvedTickets').innerText = resolvedCount;
    }

    async function updateTicketStatus(id, newStatus) {
        try {
            const res = await fetch(`/api/tickets/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });

            if (res.ok) {
                fetchTickets();
            } else {
                alert('Failed to update ticket status');
            }
        } catch (err) {
            console.error('Error updating status:', err);
        }
    }

    // Auto load on page start & refresh every 10 seconds
    fetchTickets();
    setInterval(fetchTickets, 10000);
</script>

</body>
</html>
