<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal | Support Ticket System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); min-height: 100vh; color: #f8fafc; display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; }

        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; z-index: 0; pointer-events: none; }
        .orb-1 { width: 300px; height: 300px; background: #6366f1; top: -50px; left: -50px; }
        .orb-2 { width: 350px; height: 350px; background: #ec4899; bottom: -50px; right: -50px; }

        .container { width: 100%; max-width: 600px; position: relative; z-index: 10; }

        /* Modal Overlay for Auth */
        .auth-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .auth-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 35px; border-radius: 20px; width: 90%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .auth-card h2 { text-align: center; margin-bottom: 20px; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tab-btns { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #6366f1; border-color: #6366f1; }

        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 { font-size: 1.5rem; background: linear-gradient(to right, #818cf8, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logout-btn { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #f87171; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; }
        input, select, textarea { width: 100%; padding: 12px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2); }
        
        button.submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border: none; border-radius: 12px; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- Login / Signup Modal -->
<div class="auth-overlay" id="authModal">
    <div class="auth-card">
        <h2 id="authTitle">Client Login</h2>
        <div class="tab-btns">
            <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" required placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="Enter password">
            </div>
            <button type="submit" class="submit-btn">Login to Portal</button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" style="display: none;" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>Full Name / Company Name</label>
                <input type="text" id="signupName" required placeholder="Enter name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" required placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="signupPhone" required placeholder="Enter phone">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" required placeholder="Create password">
            </div>
            <button type="submit" class="submit-btn">Create Account</button>
        </form>
    </div>
</div>

<!-- Main Ticketing Portal -->
<div class="container" id="mainPortal" style="display: none;">
    <div class="header">
        <h1><i class="fa-solid fa-headset"></i> Support Portal</h1>
        <div>
            <span id="welcomeUser" style="margin-right: 10px; font-size: 0.9rem; color: #cbd5e1;"></span>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <!-- Ticket Form Card -->
    <div class="card" id="formCard">
        <h2 style="margin-bottom: 20px; font-size: 1.2rem;">Raise a New Ticket</h2>
        <form id="ticketForm" onsubmit="handleTicketSubmit(event)">
            <div class="form-group">
                <label>Issue Category</label>
                <select id="category" required>
                    <option value="" style="background: #0f172a;">Select Issue Category</option>
                    <option value="Network" style="background: #0f172a;">Network / Wi-Fi Issue</option>
                    <option value="Camera" style="background: #0f172a;">CCTV / Camera Issue</option>
                    <option value="Telecom" style="background: #0f172a;">Telecom / EPABX Issue</option>
                </select>
            </div>

            <div class="form-group">
                <label>Priority Level</label>
                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High (Urgent)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Problem Description</label>
                <textarea id="issue" rows="4" placeholder="Describe the issue in detail..." required></textarea>
            </div>

            <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> Submit Ticket</button>
        </form>
    </div>

    <!-- Thank You / Success Card (Initially Hidden) -->
    <div class="card" id="successCard" style="display: none; text-align: center; padding: 40px 20px;">
        <div style="font-size: 4rem; color: #4ade80; margin-bottom: 15px; animation: bounceIn 0.6s ease;">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h2 style="font-size: 1.8rem; margin-bottom: 10px; color: #fff;">Thank You for Contacting Us!</h2>
        <p style="color: #94a3b8; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5;">
            Your support ticket has been successfully registered (<strong id="assignedTicketId" style="color: #818cf8;"></strong>). Our technical team has been notified and will resolve your problem soon.
        </p>
        <button onclick="resetToNewTicket()" class="submit-btn" style="max-width: 220px; margin: 0 auto;">
            <i class="fa-solid fa-plus"></i> Raise Another Ticket
        </button>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('supportUser')) || null;

    if (currentUser) {
        showPortal();
    }

    function switchTab(tab) {
        if (tab === 'login') {
            document.getElementById('loginTabBtn').classList.add('active');
            document.getElementById('signupTabBtn').classList.remove('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('authTitle').innerText = 'Client Login';
        } else {
            document.getElementById('signupTabBtn').classList.add('active');
            document.getElementById('loginTabBtn').classList.remove('active');
            document.getElementById('signupForm').style.display = 'block';
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('authTitle').innerText = 'Client Sign Up';
        }
    }

    async function handleSignup(e) {
        e.preventDefault();
        const data = {
            name: document.getElementById('signupName').value,
            email: document.getElementById('signupEmail').value,
            phone: document.getElementById('signupPhone').value,
            password: document.getElementById('signupPassword').value
        };

        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();

        if (res.ok) {
            alert('Registration Successful! Please login.');
            switchTab('login');
        } else {
            alert(result.error || 'Registration failed');
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const data = {
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        };

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();

        if (res.ok) {
            currentUser = result.user;
            localStorage.setItem('supportUser', JSON.stringify(currentUser));
            showPortal();
        } else {
            alert(result.error || 'Invalid credentials');
        }
    }

    function showPortal() {
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('mainPortal').style.display = 'block';
        document.getElementById('welcomeUser').innerText = `👤 ${currentUser.name}`;
    }

    function handleLogout() {
        localStorage.removeItem('supportUser');
        currentUser = null;
        document.getElementById('authModal').style.display = 'flex';
        document.getElementById('mainPortal').style.display = 'none';
    }

    async function handleTicketSubmit(e) {
        e.preventDefault();
        const data = {
            clientName: currentUser.name,
            phone: currentUser.phone,
            email: currentUser.email,
            category: document.getElementById('category').value,
            priority: document.getElementById('priority').value,
            issue: document.getElementById('issue').value
        };

        const res = await fetch('/api/tickets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
            document.getElementById('ticketForm').reset();
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('assignedTicketId').innerText = result.ticket.id;
            document.getElementById('successCard').style.display = 'block';
        } else {
            alert('Failed to submit ticket.');
        }
    }

    function resetToNewTicket() {
        document.getElementById('successCard').style.display = 'none';
        document.getElementById('formCard').style.display = 'block';
    }
</script>

</body>
</html>
