<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Ticket Portal | Client View</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; padding: 20px; background: #004085; color: white; border-radius: 8px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { background-color: #28a745; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #218838; }
        .success-msg { display: none; background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>IT Support Portal</h1>
        <p>Raise your Network, Camera, or Telecom issue</p>
    </header>

    <div class="card">
        <h2>Submit a Ticket</h2>
        <form id="ticketForm">
            <div class="form-group">
                <label>Your Name / Company Name *</label>
                <input type="text" id="clientName" required placeholder="Enter name">
            </div>

            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="phone" required placeholder="Enter mobile number">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter email">
            </div>

            <div class="form-group">
                <label>Issue Category *</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Network">Network / Wi-Fi Issue</option>
                    <option value="Camera">CCTV Camera Issue</option>
                    <option value="Telecom">Telecom / EPABX Issue</option>
                </select>
            </div>

            <div class="form-group">
                <label>Priority</label>
                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High (Urgent)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Problem Description *</label>
                <textarea id="issue" rows="4" required placeholder="Describe the issue..."></textarea>
            </div>

            <button type="submit">Submit Ticket</button>
        </form>
        <div id="successMessage" class="success-msg">Ticket Submitted Successfully! We will contact you soon.</div>
    </div>
</div>

<script>
    document.getElementById('ticketForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            clientName: document.getElementById('clientName').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            category: document.getElementById('category').value,
            priority: document.getElementById('priority').value,
            issue: document.getElementById('issue').value
        };

        const res = await fetch('/api/tickets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            document.getElementById('ticketForm').reset();
            const msg = document.getElementById('successMessage');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 4000);
        } else {
            alert('Failed to submit ticket.');
        }
    });
</script>

</body>
</html>
