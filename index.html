<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSupport - Client Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Glowing Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: 0;
            animation: floatOrb 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 300px; height: 300px; background: #6366f1; top: -50px; left: -50px; }
        .orb-2 { width: 350px; height: 350px; background: #ec4899; bottom: -50px; right: -50px; animation-delay: -5s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.1); }
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #cbd5e1;
            letter-spacing: 0.5px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #818cf8;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        textarea {
            padding-left: 16px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(168, 85, 247, 0.4);
        }

        .toast {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #4ade80;
            text-align: center;
            font-weight: 600;
            animation: fadeIn 0.4s ease;
        }
    </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-headset"></i> IT & Telecom Support</h1>
        <p style="color: #94a3b8;">Raise your Network, Camera or Telecom issues</p>
    </div>

    <div class="card">
        <form id="ticketForm">
            <div class="form-group">
                <label>Client / Company Name</label>
                <div class="input-icon">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="clientName" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <div class="input-icon">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label>Issue Category</label>
                <div class="input-icon">
                    <i class="fa-solid fa-list-check"></i>
                    <select id="category" required>
                        <option value="" style="background: #0f172a;">Select Category</option>
                        <option value="Network" style="background: #0f172a;">Network / Wi-Fi Issue</option>
                        <option value="Camera" style="background: #0f172a;">CCTV / Camera Issue</option>
                        <option value="Telecom" style="background: #0f172a;">Telecom / EPABX Issue</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Problem Description</label>
                <textarea id="issue" rows="4" placeholder="Describe the issue in detail..." required></textarea>
            </div>

            <button type="submit"><i class="fa-solid fa-paper-plane"></i> Submit Ticket</button>
        </form>
        <div id="toast" class="toast"><i class="fa-solid fa-circle-check"></i> Ticket Submitted Successfully!</div>
    </div>
</div>

<script>
    document.getElementById('ticketForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            clientName: document.getElementById('clientName').value,
            phone: document.getElementById('phone').value,
            category: document.getElementById('category').value,
            issue: document.getElementById('issue').value
        };

        const res = await fetch('/api/tickets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            document.getElementById('ticketForm').reset();
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }
    });
</script>
</body>
</html>
